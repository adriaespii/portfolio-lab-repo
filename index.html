<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio personal: perfil, contacto y proyectos.">
  <title>Portfolio</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- ============================================================
       PERFIL — todo el contenido se inyecta desde data/profile.json
       mediante js/main.js. No editar datos personales aquí (R4).
       ============================================================ -->
  <header class="perfil" id="perfil">
    <img
      id="perfil-foto"
      class="perfil__foto"
      src="assets/placeholder.svg"
      alt=""
      width="200"
      height="200"
    >
    <div class="perfil__info">
      <h1 id="perfil-nombre" class="perfil__nombre"></h1>
      <p id="perfil-rol" class="perfil__rol"></p>
      <p id="perfil-bio" class="perfil__bio"></p>
      <p id="perfil-ubicacion" class="perfil__ubicacion"></p>

      <nav class="perfil__contacto" aria-label="Enlaces de contacto">
        <ul class="perfil__contacto-lista">
          <li>
            <a id="contacto-email" class="contacto contacto--email" href="#">
              <span class="contacto__etiqueta">Email</span>
            </a>
          </li>
          <li>
            <a id="contacto-linkedin" class="contacto contacto--linkedin" href="#" target="_blank" rel="noopener noreferrer">
              <span class="contacto__etiqueta">LinkedIn</span>
            </a>
          </li>
          <li>
            <a id="contacto-github" class="contacto contacto--github" href="#" target="_blank" rel="noopener noreferrer">
              <span class="contacto__etiqueta">GitHub</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- ============================================================
         PROYECTOS — las tarjetas se inyectan dinámicamente desde
         data/projects.json dentro de #lista-proyectos.
         Plantilla reutilizable en <template id="plantilla-proyecto">.
         ============================================================ -->
    <section class="proyectos" id="proyectos" aria-labelledby="proyectos-titulo">
      <h2 id="proyectos-titulo">Proyectos</h2>

      <!-- Mensaje de error visible si el JSON no carga (SPEC §10) -->
      <p id="proyectos-error" class="proyectos__error" role="alert" hidden>
        No se pudieron cargar los datos.
      </p>

      <!-- Contenedor de inyección dinámica -->
      <ul id="lista-proyectos" class="proyectos__lista"></ul>

      <!-- Plantilla de tarjeta de proyecto (clonada por JS) -->
      <template id="plantilla-proyecto">
        <li class="proyecto">
          <article class="proyecto__tarjeta">
            <img class="proyecto__imagen" src="assets/placeholder.svg" alt="" width="640" height="360">
            <div class="proyecto__contenido">
              <h3 class="proyecto__titulo"></h3>
              <p class="proyecto__descripcion"></p>
              <ul class="proyecto__tecnologias" aria-label="Tecnologías usadas"></ul>
              <a class="proyecto__enlace" href="#" target="_blank" rel="noopener noreferrer">
                Ver en GitHub
              </a>
            </div>
          </article>
        </li>
      </template>
    </section>
  </main>

</body>
</html>
